name: CI/CD Pipeline - TP07

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependencias y correr Tests
      run: |
        cd backend
        npm install
        npm test  # <--- Si esto falla, el proceso se detiene aquí

    - name: Login en Docker Hub
      if: success() # Solo si los tests pasaron
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y Subir Backend
      if: success()
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: 95rodriguezfacundo/app-node-tp05:latest