name: CI/CD Pipeline - TP07

on:
  push:
    branches: [ "main" ] # Se activa al subir cambios a main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y Subir imagen del Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: 95rodriguezfacundo/app-node-tp05:latest, 95rodriguezfacundo/app-node-tp05:${{ github.run_number }}

    - name: Construir y Subir imagen del Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: 95rodriguezfacundo/frontend-tp06:latest
